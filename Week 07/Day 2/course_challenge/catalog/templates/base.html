{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}Sarah's Course Hub{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
  <nav class="navbar">
    <div class="nav-container">
      <a class="logo" href="{% url 'home' %}">Sarah's Course Hub</a>

      <div class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'courses' %}">Courses</a>
      </div>
    </div>
  </nav>

  <main class="container">
    {% block content %}
    {% endblock %}
  </main>

  <footer>
    <p>© 2026 Sarah's Course Hub</p>
  </footer>
</body>
</html>
