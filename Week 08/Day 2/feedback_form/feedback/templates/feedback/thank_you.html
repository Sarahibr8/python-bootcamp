<!DOCTYPE html>
<html>
<head>
    <title>Thank You</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f1ea;
            color: #292929;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .thank-you-card {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 55px 45px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.10);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #dce9e4;
            color: #355c5a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 40px;
            color: #355c5a;
        }

        p {
            margin: 0;
            color: #777;
            font-size: 17px;
            line-height: 1.6;
        }

        .message {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background: #f7f4ee;
            color: #555;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .thank-you-card {
                padding: 40px 25px;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="thank-you-card">

        <div class="icon">✓</div>

        <h1>Thank You!</h1>

        <p>
            Your feedback has been submitted successfully.
        </p>

        <div class="message">
            We appreciate you taking the time to share your thoughts.
        </div>

    </div>

</body>
</html>
